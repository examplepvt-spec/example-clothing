<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — EXAMPLE CLOTHING</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#161412;
  --ivory:#f6f3ec;
  --ivory-dim:#eee9dd;
  --brass:#9c7a3c;
  --brass-soft:#c7ab74;
  --oxblood:#5e2430;
  --line:#e2dccb;
  --white:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--ivory);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:40px;
}

h1{
  font-family:'Libre Caslon Display',serif;
  font-weight:400;
}

a{
  color:inherit;
}

/* ---------- HEADER ---------- */

.header{
  position:sticky;
  top:0;
  width:100%;
  height:68px;
  background:rgba(246,243,236,.95);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:1000;
  border-bottom:1px solid var(--line);
}

.back-btn{
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  text-decoration:none;
}

.back-btn:hover{
  background:var(--ivory-dim);
}

.back-btn svg{
  width:20px;
  height:20px;
  stroke:var(--ink);
  fill:none;
  stroke-width:1.8;
}

.header-title{
  font-family:'Libre Caslon Display',serif;
  font-size:16px;
  flex:1;
  text-align:center;
}

.cart-icon{
  position:relative;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  text-decoration:none;
}

.cart-icon:hover{
  background:var(--ivory-dim);
}

.cart-icon svg{
  width:20px;
  height:20px;
  stroke:var(--ink);
  fill:none;
  stroke-width:1.6;
}

.badge{
  position:absolute;
  top:0;
  right:0;
  background:var(--brass);
  color:var(--white);
  min-width:16px;
  height:16px;
  padding:0 3px;
  border-radius:50%;
  font-size:10px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ---------- SLIDER ---------- */

.slider{
  position:relative;
  background:var(--ivory-dim);
  overflow:hidden;
}

.slider img{
  width:100%;
  height:420px;
  object-fit:contain;
  background:var(--ivory-dim);
  display:block;
}

.slide-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:var(--white);
  box-shadow:0 2px 8px rgba(0,0,0,.12);
  font-size:22px;
  cursor:pointer;
  color:var(--ink);
}

#prev{ left:14px; }
#next{ right:14px; }

.counter{
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(22,20,18,.75);
  color:var(--ivory);
  padding:5px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

/* ---------- DETAILS ---------- */

.details{
  padding:24px 20px 0;
}

.eyebrow{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--brass);
  font-weight:700;
  display:block;
  margin-bottom:8px;
}

h1#name{
  font-size:26px;
  line-height:1.25;
}

.price-box{
  display:flex;
  align-items:baseline;
  gap:12px;
  margin:16px 0 4px;
}

.old-price{
  font-size:17px;
  color:#999;
  text-decoration:line-through;
}

.price{
  font-size:28px;
  font-weight:700;
  font-family:'Libre Caslon Display',serif;
}

.discount{
  font-size:14px;
  font-weight:700;
  color:var(--oxblood);
  margin-bottom:10px;
}

h3.section-label{
  font-size:12px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#666;
  font-weight:700;
  margin:22px 0 12px;
}

.sizes{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.sizes button{
  min-width:52px;
  height:52px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--white);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  color:var(--ink);
  transition:.2s;
}

.sizes button:hover,
.sizes button.selected{
  background:var(--ink);
  color:var(--ivory);
  border-color:var(--ink);
}

.sizes button:disabled,
.sizes button.disabled{
  opacity:0.4;
  background:var(--ivory-dim);
  color:#888;
  border-color:var(--line);
  cursor:not-allowed;
  text-decoration:line-through;
  pointer-events:none;
}

.info{
  margin:20px 0 0;
  font-size:14px;
  color:#666;
  font-weight:500;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  padding:16px 20px;
  text-align:center;
  text-decoration:none;
  border-radius:6px;
  font-weight:600;
  font-size:15px;
  letter-spacing:.3px;
  border:none;
  box-sizing:border-box;
  cursor:pointer;
  transition:all .2s;
}

#addToCart{
  background:var(--ink);
  color:var(--ivory);
  font-size:16px;
  letter-spacing:.5px;
  text-transform:uppercase;
  box-shadow:0 4px 14px rgba(22,20,18,.12);
}

#addToCart:hover:not(:disabled){
  background:var(--brass);
  color:var(--white);
  transform:translateY(-1px);
  box-shadow:0 6px 18px rgba(156,122,60,.25);
}

#addToCart:disabled{
  background:#bbb;
  color:#666;
  cursor:not-allowed;
  opacity:0.7;
  transform:none;
  box-shadow:none;
}

.secondary-actions{
  display:flex;
  gap:10px;
  margin-top:10px;
}

#wishlist{
  background:var(--white);
  color:var(--ink);
  border:1px solid var(--line);
  flex:1;
  margin-top:0;
}

#wishlist:hover{
  border-color:var(--ink);
  background:var(--ivory-dim);
}

#whatsapp{
  background:#25D366;
  color:#ffffff;
  flex:1;
  margin-top:0;
}

#whatsapp:hover{
  background:#1eb855;
  transform:translateY(-1px);
}

.action-row{
  margin-top:24px;
  padding-bottom:6px;
}

/* TRUST BADGES */
.trust-badges{
  margin-top:16px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 16px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.trust-badge-item{
  display:flex;
  align-items:center;
  gap:10px;
  text-align:left;
}

.trust-badge-item svg{
  flex-shrink:0;
}

.trust-title{
  font-size:12px;
  font-weight:700;
  color:var(--ink);
  line-height:1.2;
}

.trust-sub{
  font-size:10px;
  color:#666;
  margin-top:2px;
}

@media(max-width:560px){
  .trust-badges{
    grid-template-columns:1fr;
    gap:12px;
  }
}

.error-banner{
  margin:60px 20px;
  text-align:center;
  color:#666;
}

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);
  color:var(--ivory);
  padding:14px 22px;
  border-radius:6px;
  font-size:14px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:3000;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="header">
  <a href="javascript:void(0)" onclick="if(document.referrer && document.referrer.indexOf(location.host)!==-1){history.back();}else{location.href='index.html';}" class="back-btn" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  </a>
  <a href="index.html" class="header-title" style="text-decoration:none;">EXAMPLE CLOTHING</a>
  <a href="cart.html" class="cart-icon" aria-label="Cart">
    <svg viewBox="0 0 24 24"><path d="M4 7h16l-1.4 10.3a2 2 0 0 1-2 1.7H7.4a2 2 0 0 1-2-1.7L4 7Z"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
    <span class="badge" id="cartCount">0</span>
  </a>
</div>

<div id="productWrap">

<div class="slider">
  <img id="productImage" src="" alt="Product image">
  <button id="prev" class="slide-btn" aria-label="Previous image">‹</button>
  <button id="next" class="slide-btn" aria-label="Next image">›</button>
  <div class="counter"><span id="current">1</span> / <span id="total">1</span></div>
</div>

<div class="details">

  <span class="eyebrow">Genuine Brand</span>
  <h1 id="name"></h1>

  <div class="price-box">
    <span class="old-price" id="oldPrice"></span>
    <span class="price" id="price"></span>
  </div>

  <div class="discount" id="discount"></div>

  <h3 class="section-label" id="sizeLabel">Select Size</h3>
  <div class="sizes" id="sizeRow">
    <button id="sizeXS" data-size="XS">XS</button>
    <button id="sizeS" data-size="S">S</button>
    <button id="sizeM" data-size="M">M</button>
    <button id="sizeL" data-size="L">L</button>
    <button id="sizeXL" data-size="XL">XL</button>
    <button id="sizeXXL" data-size="XXL">XXL</button>
  </div>

  <div class="info">Barcode: <span id="barcode"></span></div>

  <div class="action-row">
    <button class="btn" id="addToCart">Add To Cart</button>

    <div class="secondary-actions">
      <button class="btn" id="wishlist" aria-label="Add to Wishlist">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2"><path d="M12 20.2s-7.6-4.5-9.9-9C.6 8 2 4.5 5.4 3.7c2-.5 3.9.3 5 2 .3.4.5.9.6 1.3.1-.4.3-.9.6-1.3 1.1-1.7 3-2.5 5-2 3.4.8 4.8 4.3 3.3 7.5-2.3 4.5-9.9 9-9.9 9Z"/></svg>
        <span>Wishlist</span>
      </button>
      <a class="btn" href="#" id="whatsapp" target="_blank" rel="noopener" aria-label="Order on WhatsApp">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        <span>WhatsApp</span>
      </a>
    </div>
  </div>

  <!-- TRUST BADGES -->
  <div class="trust-badges">
    <div class="trust-badge-item">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--brass)" fill="none" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
      <div>
        <div class="trust-title">Genuine Brands</div>
        <div class="trust-sub">100% Authentic</div>
      </div>
    </div>
    <div class="trust-badge-item">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--brass)" fill="none" stroke-width="1.8"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
      <div>
        <div class="trust-title">Quality Checked</div>
        <div class="trust-sub">Inspected Item</div>
      </div>
    </div>
    <div class="trust-badge-item">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--brass)" fill="none" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <div>
        <div class="trust-title">Calicut Store</div>
        <div class="trust-sub">Kerala, India</div>
      </div>
    </div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

import { db } from "./firebase.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const productWrap = document.getElementById("productWrap");
const toast = document.getElementById("toast");

function showToast(msg){
  toast.innerText = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

function showError(msg){
  productWrap.innerHTML = `<div class="error-banner"><h3>${msg}</h3></div>`;
}

function updateCartCount(){
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  let totalQty = 0;
  cart.forEach(item => { totalQty += item.qty || 1; });
  document.getElementById("cartCount").innerText = totalQty;
}

updateCartCount();

if(!id){
  showError("No product specified.");
} else {

  try {
    const docRef = doc(db, "products", id);
    const docSnap = await getDoc(docRef);

    if(!docSnap.exists()){
      showError("This product could not be found.");
    } else {

      const product = docSnap.data();
      let selectedSize = null;

      // Check hasSizes boolean field and category fallback
      const isSizeless = product.hasSizes === false || product.hasSizes === "false" || (product.category && product.category.trim().toLowerCase() === "sunglasses");
      const hasSizes = !isSizeless;

      // ---- Images ----
      const images = [
        product.image?.replace("/upload/","/upload/f_auto,q_auto,w_900/"),
        product.image2?.replace("/upload/","/upload/f_auto,q_auto,w_900/"),
        product.image3?.replace("/upload/","/upload/f_auto,q_auto,w_900/")
      ].filter(Boolean);

      let currentImage = 0;
      const imageElement = document.getElementById("productImage");

      if(images.length > 0){
        imageElement.src = images[0];
        images.forEach(src => { const img = new Image(); img.src = src; });
      }

      document.getElementById("total").innerText = images.length || 1;

      document.getElementById("next").onclick = () => {
        if(images.length === 0) return;
        currentImage = (currentImage + 1) % images.length;
        imageElement.src = images[currentImage];
        document.getElementById("current").innerText = currentImage + 1;
      };

      document.getElementById("prev").onclick = () => {
        if(images.length === 0) return;
        currentImage = (currentImage - 1 + images.length) % images.length;
        imageElement.src = images[currentImage];
        document.getElementById("current").innerText = currentImage + 1;
      };

      // ---- Text content ----
      document.getElementById("name").textContent = product.name || "";
      document.getElementById("barcode").textContent = product.barcode || "-";

      const price = Number(product.price) || 0;
      const offerPrice = product.offerPrice ? Number(product.offerPrice) : null;

      document.getElementById("price").textContent = "₹" + price;

      if(offerPrice && offerPrice < price){
        document.getElementById("oldPrice").textContent = "₹" + price;
        document.getElementById("price").textContent = "₹" + offerPrice;
        const discountPct = Math.round(((price - offerPrice) / price) * 100);
        document.getElementById("discount").textContent = discountPct + "% OFF";
      } else {
        document.getElementById("oldPrice").style.display = "none";
        document.getElementById("discount").style.display = "none";
      }

      // ---- Sizes and Stock handling ----
      let anySizeAvailable = false;
      const sizeMap = {
        XS: product.xsStock,
        S: product.sStock,
        M: product.mStock,
        L: product.lStock,
        XL: product.xlStock,
        XXL: product.xxlStock
      };

      if (!hasSizes) {
        // Hide size selection UI for sizeless products (e.g. Sunglasses)
        document.getElementById("sizeLabel").style.display = "none";
        document.getElementById("sizeRow").style.display = "none";

        const totalStock = Number(product.stock) || 0;
        anySizeAvailable = totalStock > 0;
      } else {
        // Clothing products
        Object.entries(sizeMap).forEach(([size, stock]) => {
          const btn = document.getElementById("size" + size);
          if (!btn) return;
          const stockNum = Number(stock) || 0;

          if (stockNum <= 0) {
            btn.disabled = true;
            btn.classList.add("disabled");
            btn.setAttribute("aria-disabled", "true");
            btn.title = size + " (Out of Stock)";
            btn.onclick = null;
          } else {
            anySizeAvailable = true;
            btn.disabled = false;
            btn.classList.remove("disabled");
            btn.removeAttribute("aria-disabled");
            btn.textContent = size + " (" + stockNum + ")";
            btn.onclick = () => {
              document.querySelectorAll(".sizes button").forEach(b => b.classList.remove("selected"));
              btn.classList.add("selected");
              selectedSize = size;
            };
          }
        });
      }

      const addToCartBtn = document.getElementById("addToCart");

      if(!anySizeAvailable){
        addToCartBtn.textContent = "Out of Stock";
        addToCartBtn.disabled = true;
      }

      // ---- Add to cart ----
      addToCartBtn.onclick = () => {
        if(!anySizeAvailable) return;

        let availableStock = 0;
        let existing = null;
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        if(hasSizes){
          if(!selectedSize){
            showToast("Please select a size");
            return;
          }
          availableStock = Number(sizeMap[selectedSize]) || 0;
          existing = cart.find(item => item.id === id && item.size === selectedSize);
        } else {
          availableStock = Number(product.stock) || 0;
          existing = cart.find(item => item.id === id && (!item.size || item.hasSizes === false));
        }

        const currentQty = existing ? (existing.qty || 1) : 0;

        // Stock validation check
        if (currentQty + 1 > availableStock) {
          if (availableStock === 1) {
            showToast("Only 1 item available in stock.");
          } else if (availableStock <= 0) {
            showToast("Item is out of stock.");
          } else {
            showToast(`Only ${availableStock} items available in stock.`);
          }
          return;
        }

        if(existing){
          existing.qty = currentQty + 1;
          existing.maxStock = availableStock;
        } else {
          cart.push({
            id: id,
            name: product.name,
            price: price,
            offerPrice: offerPrice,
            image: product.image,
            size: hasSizes ? selectedSize : null,
            hasSizes: hasSizes,
            qty: 1,
            maxStock: availableStock
          });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
        showToast("Added to cart");
      };

      // ---- Wishlist ----
      document.getElementById("wishlist").onclick = () => {
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

        if(wishlist.some(item => item.id === id)){
          showToast("Already in wishlist");
          return;
        }

        wishlist.push({
          id: id,
          name: product.name,
          price: price,
          image: product.image
        });

        localStorage.setItem("wishlist", JSON.stringify(wishlist));
        showToast("Added to wishlist");
      };

      // ---- WhatsApp ----
      const waMessage = encodeURIComponent("I want " + (product.name || "this product"));
      document.getElementById("whatsapp").href = "https://wa.me/919656003555?text=" + waMessage;

    }
  } catch(err){
    console.error(err);
    showError("Something went wrong loading this product. Please try again.");
  }
}

</script>

</body>
</html>
